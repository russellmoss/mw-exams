# question-audit-daily.yml — daily corpus sweep of the hard question validator, with quarantine.
#
# The generation engine now audits + quarantines every NEW question the moment its stem answer key
# lands (src/lib/question-audit.ts, chained in question-engine.ts). This sweep is the backstop for
# everything that path cannot reach:
#   - questions whose enrichment failed, so no key ever landed (unkeyed rows escape the per-question
#     audit entirely — the join finds nothing);
#   - re-verdicts after a RULE change (a new synonym or country canonicalisation changes what counts
#     as a violation across the whole corpus, not just new rows);
#   - clearing stale flags: audit-questions.mjs --apply un-quarantines questions that a rule fix has
#     made clean again, which the set-only per-question audit deliberately never does.
#
# A second sweep runs the wine-bank cuvée audit. That gate lives in matchScore (wine-bank-lookup.ts)
# and is correct in the deployed build, but it only governs the code that is *running*. Generation is
# routinely driven from developer worktrees against this same production database, and a worktree on a
# branch older than the gate writes wrong-cuvée provenance no matter what production is serving — a
# Pinot Noir question fed a Pinotage profile, a Tokaji Aszú fed a dry Furmint. Nineteen such slots
# accumulated unnoticed because the audit only ever ran by hand. It is cheap and idempotent, so it
# belongs on a schedule.
#
# Runs daily; also on demand via workflow_dispatch. Read-modify on the live DB, no git writes, no
# deploy — so no [skip ci] concerns and no interaction with the Vercel cron budget (this is exactly
# the "GitHub Actions, not Vercel crons" pattern CLAUDE.md prescribes for scheduled work).

name: question-audit-daily

on:
  schedule:
    - cron: "40 6 * * *" # daily, 06:40 UTC — after the overnight bank batches settle
  workflow_dispatch:

permissions:
  contents: read

# Shared with corpus-reaudit.yml, which runs the same `audit-questions.mjs --apply` on a rule-touching
# push to master. Two concurrent --apply passes would race on invalid_reasons — one quarantining while
# the other clears. Not cancel-in-progress: a half-finished sweep leaves the bank partly re-verdicted,
# which is worse than the second run waiting.
concurrency:
  group: corpus-audit-apply
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: study-app
        run: npm ci

      # ts-loader is required, not optional: audit-questions.mjs imports src/lib/question-validator.ts,
      # which imports "./tasting-validators" extensionless — plain `node` cannot resolve that and every
      # run from 2026-08-07 07:53 UTC onward died with ERR_MODULE_NOT_FOUND, silently taking the whole
      # quarantine backstop offline (the failure surfaces only in the Actions log). Same invocation the
      # bank-match step below already uses.
      - name: Audit + quarantine (hard violations → invalid_reasons)
        working-directory: study-app
        run: node --import ./scripts/ts-loader.mjs scripts/audit-questions.mjs --apply

      # Runs even if the step above fails: the two audits are independent, and a question-validator
      # problem should not leave wrong-wine profiles being served. ts-loader is the repo's existing
      # way to run a .mts that imports the app's extensionless .ts libs — no tsx dependency needed.
      # The script self-loads .env.local only when DATABASE_URL is unset, so the secret above wins.
      - name: Audit + clear wrong-cuvée bank matches
        if: always()
        working-directory: study-app
        run: node --import ./scripts/ts-loader.mjs scripts/audit-bank-matches.mts --apply

      # --apply backs up every profile it replaces before clearing it. This workflow makes no git
      # writes, so without this the backup for anything cleared *today* would die with the runner and
      # a wrongly-cleared slot could not be restored. The glob also picks up the backups already
      # committed to data/ — redundant but harmless, and it keeps the step from depending on the
      # runner's date matching the filename the script chose.
      - name: Keep the cleared profiles recoverable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrong-cuvee-cleared-profiles
          path: data/wine_profiles_wrong_cuvee_backup_*.json
          if-no-files-found: ignore
          retention-days: 90
