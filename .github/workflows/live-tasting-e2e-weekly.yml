name: live-tasting-e2e-weekly

# Weekly agentic self-test for Live Tasting (live_tasting_plan.md §9.3) — the standing drift
# detector for the failure modes unit tests structurally cannot see: Tavily result drift,
# retailer sites dying, and model regressions in pinned-flight generation or grading.
#
# Runs the FULL real pipeline against production as the dedicated E2E user (New Hope, PA pilot
# market): create → redaction probe → partner share → stockist link liveness → LLM-judge audit →
# good-vs-bad grading discrimination → one-shot semantics → cleanup. The script deletes every
# row it creates (sessions/attempts/questions) and keeps only the retail_availability cache —
# which doubles as cache warming for the pilot user's market.
#
# NOT A VERCEL CRON on purpose: the Hobby plan caps Vercel crons at 2 daily jobs, and sub-daily
# schedules silently kill git auto-deploy (see bank-worker-hourly.yml for the war story).
#
# Budget per run: ~2 question generations, ~6 LLM calls, ≤~12 Tavily searches (cache absorbs
# most after the first run). Papers rotate weekly inside the script.
#
# SETUP (repo Actions secrets): DATABASE_URL, ANTHROPIC_API_KEY, LT_E2E_PASSWORD.

on:
  schedule:
    # Mondays 09:17 UTC — offset minute per GitHub's guidance to dodge top-of-hour congestion.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      paper:
        description: "Paper to test (1, 2 or 3; empty = weekly rotation)"
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: study-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: study-app/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Run Live Tasting E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LT_E2E_PASSWORD: ${{ secrets.LT_E2E_PASSWORD }}
        run: |
          if [ -n "${{ inputs.paper }}" ]; then
            node scripts/live-tasting-e2e.mjs --paper "${{ inputs.paper }}"
          else
            node scripts/live-tasting-e2e.mjs
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-tasting-e2e-report
          path: outputs/live_tasting_e2e/*.md
          if-no-files-found: ignore

  # Phase D3 (user-1 requirement): generate a REAL half paper against production every week and
  # verify composition contract, per-flight EK invariants, cross-flight dedup, and an examiner
  # judge's would-pass-as-real verdict against two real corpus papers. Papers rotate weekly.
  paper-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: study-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: study-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run Paper QA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LT_E2E_PASSWORD: ${{ secrets.LT_E2E_PASSWORD }}
        run: node scripts/live-tasting-paper-qa.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-tasting-paper-qa-report
          path: outputs/live_tasting_paper_qa/*.md
          if-no-files-found: ignore
