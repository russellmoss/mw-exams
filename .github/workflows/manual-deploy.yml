name: manual-deploy

# Break-glass production deploy, bypassing git auto-deploy.
#
# WHEN TO USE: git auto-deploy is starved (Hobby-plan daily deployment limit exhausted by bot
# push volume — see 2026-08-05/06) or the Vercel↔GitHub integration is down, and a fix needs to
# ship NOW. This deploys whatever is on master via the Vercel CLI using the repo's VERCEL_TOKEN.
#
# NOTE: a CLI deploy counts against the same Hobby deployment quota as a git deploy — if the
# account is hard rate-limited, this fails with the same message and nothing ships anywhere.
#
# The .vercel link is written inline (the directory is gitignored); project/org ids are the ones
# documented in CLAUDE.md. `vercel pull` fetches the real project settings (Root Directory
# study-app, env), `vercel build` builds locally in CI, `deploy --prebuilt` uploads the artifact.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Link project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_1FOrN1z4uYqJZZoBx7JVmpaNVKQM","orgId":"team_UMX0qBzZ61GaCUri4A9hydvQ"}' > .vercel/project.json

      - name: Pull settings, build, deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          # DATABASE_URL is a Sensitive env var on Vercel, so `vercel pull` writes an unusable
          # placeholder — prebuild (scripts/migrate.mjs) then crashes on "not a valid URL"
          # (first three runs of this workflow, 2026-08-06). Substitute the repo Actions secret
          # (already used by bank-fill.yml / auto-feedback.yml) into the pulled env file so the
          # local CI build migrates against the real database, exactly as a Vercel build would.
          grep -v '^DATABASE_URL=' .vercel/.env.production.local > .vercel/.env.tmp || true
          mv .vercel/.env.tmp .vercel/.env.production.local
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> .vercel/.env.production.local
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
