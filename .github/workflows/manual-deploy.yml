name: manual-deploy

# Break-glass production deploy, bypassing git auto-deploy.
#
# WHEN TO USE: git auto-deploy is starved (Hobby-plan daily deployment limit exhausted by bot
# push volume — see 2026-08-05/06) or the Vercel↔GitHub integration is down, and a fix needs to
# ship NOW. This deploys whatever is on master via the Vercel CLI using the repo's VERCEL_TOKEN.
#
# NOTE: a CLI deploy counts against the same Hobby deployment quota as a git deploy — if the
# account is hard rate-limited, this fails with the same message and nothing ships anywhere.
# Since 2026-08-06 the bot workflows run .github/scripts/deploy-quota-guard.sh and stop
# auto-merging at 100−reserve (default 80) deployments per rolling day, so this break-glass path
# should normally find headroom. If it still hits the limit, a human spent the reserve too —
# wait for the rolling window to free slots (deployments age out 24h after creation).
#
# The .vercel link is written inline (the directory is gitignored); project/org ids are the ones
# documented in CLAUDE.md. `vercel deploy --prod` uploads the SOURCE and lets Vercel build it
# server-side, exactly as a git deploy would.
#
# NEVER build locally here (`vercel pull` + `vercel build` + `deploy --prebuilt`). That was the
# original shape of this workflow and it could not deploy at all:
#
#   1. `vercel build` runs `npm run build`, whose `prebuild` runs scripts/migrate.mjs.
#   2. shouldRunMigrations() sees no VERCEL_ENV in the runner and returns
#      {run: true, "not a Vercel build"} — the "a human is driving" case. There is a force-on
#      escape hatch (MIGRATE_ALLOW_NON_PRODUCTION=1) but no force-off.
#   3. DATABASE_URL is marked Sensitive in the Vercel project, so `vercel pull` cannot decrypt it
#      and writes the literal string `[SENSITIVE]` into .vercel/.env.production.local.
#   4. migrate.mjs hands `[SENSITIVE]` to neon() → "not a valid URL" → prebuild fails the build.
#
# It only failed SAFELY because the secret was undecryptable. Do not "fix" that by putting
# DATABASE_URL in this workflow's env: that makes CI migrate the production database on every
# break-glass deploy — the exact hazard ci.yml's header warns about, and the cause of three prior
# outages (see CLAUDE.md, "Only PRODUCTION deploys migrate the database"). Building server-side
# keeps migrations where they belong: in a real production deploy, with VERCEL_ENV=production and
# the real, decrypted DATABASE_URL.
#
# That fix was in fact attempted (f505698, reverted here) — it substituted the repo's DATABASE_URL
# Actions secret into the pulled env file. Beyond the hazard above, it gets the ORDERING wrong in
# the one situation this workflow exists for. Local build migrates production first, THEN uploads;
# so when the upload is refused — quota exhaustion, the very thing that starves auto-deploy — the
# database has moved and the code has not. Server-side, a refused deploy never builds, so nothing
# migrates: schema and code land together or not at all.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Link project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_1FOrN1z4uYqJZZoBx7JVmpaNVKQM","orgId":"team_UMX0qBzZ61GaCUri4A9hydvQ"}' > .vercel/project.json

      - name: Deploy (Vercel builds server-side)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
