name: auto-feedback

# Verified feedback → code-change → ship pipeline.
# The study-app fires a repository_dispatch (event_type: auto-feedback) when an accepted
# feedback item should become a code change. This workflow makes the change with headless
# Claude, verifies it (lint + typecheck + tests + build) with a self-heal retry loop, and:
#   - GREEN  → merges to master. Vercel git auto-deploy then ships it (single deploy path).
#   - RED    → opens a PR for review; master is never touched by an unverified change.
# Results are written back to feedback_analyses for the admin UI.
#
# DEPLOY MODEL: git auto-deploy is ENABLED (study-app/vercel.json git.deploymentEnabled=true), so a
# merge to master that touches study-app/ is built + deployed by Vercel automatically — the single
# deploy path shared by human pushes and these bot merges. This workflow no longer runs an explicit
# `vercel --prod`. The vercel.json ignoreCommand skips builds for [skip ci] commits (e.g. the
# knowledge-doc sync) and for commits that don't touch study-app/. (Requires the Vercel↔GitHub
# integration to be connected; if it ever disconnects, fall back to a manual `npx vercel --prod`.)
#
# STALE-BASE SAFETY (added 2026-08-02; ported from feature-build.yml):
# This job branches from master at checkout and merges at the end, with a Claude heal loop in
# between — so master can move underneath it (a human push, a feature-build merge, another
# auto-feedback run). The green CI from the heal loop belongs to the PRE-rebase tree, so blindly
# rebasing and merging can ship a build that never compiled: the rebase applies cleanly while the
# code still references symbols the new master deleted. The landing step therefore records the base
# commit, and if master has moved it rebases and RE-RUNS the blocking gate (tsc + tests + build) on
# the rebased tree before merging. Anything that fails refuses to touch master and falls through to
# the PR step, with the reason surfaced in the PR body and in feedback_analyses.apply_error.
#
# Deliberately NO FIFO mutex here (unlike feature-build.yml). Feedback changes are small, usually
# path-isolated by the scope guard, and run often — serializing them would queue the pipeline for
# little gain. auto-feedback runs concurrently and relies on rebase + re-verify alone.

on:
  repository_dispatch:
    types: [auto-feedback]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-feedback-${{ github.event.client_payload.attemptId }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      ATTEMPT_ID: ${{ github.event.client_payload.attemptId }}
      ANALYSIS_ID: ${{ github.event.client_payload.analysisId }}
      # Set (instead of ANALYSIS_ID) when the dispatch came from the bin-fix miner: results are
      # recorded to bin_fix_proposals, and the feedback-only steps (EK sync) skip on empty ANALYSIS_ID.
      BIN_PROPOSAL_ID: ${{ github.event.client_payload.binProposalId }}
      WORK_BRANCH: ${{ github.event.client_payload.workBranch }}
      APPLIED_BY: ${{ github.event.client_payload.appliedBy }}
      ALLOWED_PATHS: ${{ github.event.client_payload.allowedPaths }}
      REVIEW_ONLY: ${{ github.event.client_payload.reviewOnly }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_DIR: study-app
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      # The commit this branch is cut from — i.e. the master the heal loop's green CI is valid for.
      # Surfaced in the merge commit and the PR body so a change that landed against a stale master
      # is obvious at review time.
      - name: Record base commit
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Branching from master @ $(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config user.name "mw-auto-feedback[bot]"
          git config user.email "auto-feedback@users.noreply.github.com"

      - name: Create work branch
        run: git checkout -b "$WORK_BRANCH"

      - name: Install app dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write change brief
        env:
          PROPOSED: ${{ github.event.client_payload.analysisText }}
          CONTEXT: ${{ github.event.client_payload.context }}
        run: |
          mkdir -p /tmp/af
          {
            echo "# Feedback-driven change request"
            echo
            echo "$CONTEXT"
            echo
            echo "## Analysis & proposed change (authoritative — implement this)"
            echo "$PROPOSED"
            if [ -n "$ALLOWED_PATHS" ]; then
              echo
              echo "## SCOPE CONSTRAINT (hard)"
              echo "This is feature-isolated feedback. Modify ONLY files under these path prefixes:"
              echo "$ALLOWED_PATHS" | sed 's/^/  - /'
              echo "Do NOT touch any file outside them. A change that strays will be REJECTED (PR-gated, not merged)."
              echo "For an answer-key DATA fix: edit the relevant data/*.json then the change is picked up by the build."
            fi
          } > /tmp/af/brief.md
          echo "----- brief.md -----"
          cat /tmp/af/brief.md

      - name: Implement + verify + self-heal
        id: heal
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          BRIEF="$(cat /tmp/af/brief.md)"
          CHECKS=/tmp/af/checks.log
          MAX=3
          ATTEMPT=0
          SUCCESS=0
          while [ $ATTEMPT -lt $MAX ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "::group::Claude iteration $ATTEMPT"
            if [ "$ATTEMPT" -eq 1 ]; then
              INSTRUCTION="You are applying a user-feedback-driven change to this repository. The Next.js study-app lives at $(pwd). Implement the change described below with minimal, correct edits anywhere in the repository. Do NOT change unrelated behavior or reformat untouched code."
            else
              INSTRUCTION="Your previous edit did NOT pass CI. Fix the code so that 'npm run lint', 'npx tsc --noEmit', 'npm test', and 'npm run build' all succeed in $(pwd). Change only what is needed to fix the errors. The failing CI output is appended at the end of this prompt."
            fi
            {
              printf '%s\n\n' "$INSTRUCTION"
              cat /tmp/af/brief.md
              if [ "$ATTEMPT" -gt 1 ]; then printf '\n\n## Failing CI output\n'; cat "$CHECKS"; fi
            } > /tmp/af/prompt.txt
            claude --bare -p "$(cat /tmp/af/prompt.txt)" \
              --allowedTools "Bash,Read,Edit,Write,Glob,Grep" \
              --max-turns 40 \
              --model claude-opus-4-8
            echo "::endgroup::"

            echo "::group::Authoritative checks (iteration $ATTEMPT)"
            : > $CHECKS
            # Lint is ADVISORY (the repo has pre-existing lint debt and next build does not
            # gate on it). We report new-vs-old lint for visibility but do not block on it.
            echo "--- npm run lint (advisory) ---" | tee -a $CHECKS
            npm run lint 2>&1 | tee -a $CHECKS; L=${PIPESTATUS[0]}
            # tsc + tests + build are the BLOCKING gate. next build runs the TS compiler and fails
            # on type errors, so passing build == production-safe.
            echo "--- npx tsc --noEmit (blocking) ---" | tee -a $CHECKS
            npx tsc --noEmit 2>&1 | tee -a $CHECKS; T=${PIPESTATUS[0]}
            # Unit tests run before build (seconds vs ~45s, and they cover logic build cannot see —
            # e.g. the migration-runner SQL splitter). They gate on TEST_DATABASE_URL, not
            # DATABASE_URL, so the DB-backed suites stay skipped here and never touch real data.
            echo "--- npm test (blocking) ---" | tee -a $CHECKS
            npm test 2>&1 | tee -a $CHECKS; V=${PIPESTATUS[0]}
            echo "--- npm run build (blocking) ---" | tee -a $CHECKS
            npm run build 2>&1 | tee -a $CHECKS; B=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "lint=$L (advisory) tsc=$T test=$V build=$B"
            if [ $T -eq 0 ] && [ $V -eq 0 ] && [ $B -eq 0 ]; then SUCCESS=1; break; fi
          done
          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"

          # Stage changes (whole repo — Claude may edit anything), excluding generated data.
          cd "$GITHUB_WORKSPACE"
          git add -A
          git reset -- "$APP_DIR/public/data/pipeline-context.json" "$APP_DIR/public/data/question-index.json" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no_changes=1" >> "$GITHUB_OUTPUT"
            echo "No code changes were produced."
          else
            git commit -m "[auto-feedback attempt:${ATTEMPT_ID}] apply user feedback" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Scope guard (feature isolation)
        # When ALLOWED_PATHS is set (e.g. Stem Sniper feedback), every changed file must sit under
        # one of those prefixes. If anything strays, we DO NOT merge — the change is PR-gated for
        # human review, so feedback on one feature can never silently edit another.
        if: steps.heal.outputs.success == '1' && steps.heal.outputs.no_changes != '1'
        id: scope
        run: |
          if [ -z "$ALLOWED_PATHS" ]; then
            echo "out_of_scope=0" >> "$GITHUB_OUTPUT"
            echo "No ALLOWED_PATHS set — repo-wide change permitted."
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only master.."$WORK_BRANCH")
          STRAY=0
          for f in "${CHANGED[@]}"; do
            [ -z "$f" ] && continue
            ok=0
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              case "$f" in "$p"*) ok=1; break;; esac
            done <<< "$ALLOWED_PATHS"
            if [ "$ok" -eq 0 ]; then echo "OUT OF SCOPE: $f"; STRAY=1; fi
          done
          echo "out_of_scope=$STRAY" >> "$GITHUB_OUTPUT"
          if [ "$STRAY" -eq 0 ]; then echo "All ${#CHANGED[@]} changed file(s) within allowed paths."; fi

      # Land on master, defending against master having moved while we built.
      #
      # The green CI from the heal loop was produced against BASE_SHA. If master has moved since,
      # that signal is stale, so we rebase and RE-RUN the blocking gate (tsc + tests + build) on the
      # rebased tree before merging — a rebase can apply cleanly while the code still references
      # symbols the new master deleted, which would merge clean and auto-deploy a broken build.
      # Anything that fails here refuses to touch master and falls through to the PR step.
      #
      # reviewOnly (generation/validator changes) are PR-gated for human review — never auto-merged.
      - name: Rebase onto latest master, re-verify, and land
        if: steps.heal.outputs.success == '1' && steps.heal.outputs.no_changes != '1' && steps.scope.outputs.out_of_scope != '1' && env.REVIEW_ONLY != 'true'
        id: merge
        run: |
          set -e
          BASE_SHA="${{ steps.base.outputs.sha }}"
          git push origin "$WORK_BRANCH"

          # `npm run build` regenerates tracked files (public/data/*.json, which the heal step
          # deliberately leaves unstaged), so the worktree can be dirty here. `git checkout master`
          # tolerated that; `git rebase` REFUSES to run with unstaged changes. Everything we mean to
          # keep is already committed, so discard the build's leavings before touching branches.
          git checkout -- . 2>/dev/null || true

          # The master commit our current green CI signal is valid for.
          VERIFIED_AGAINST="$BASE_SHA"
          ATTEMPT=0
          MERGED=0

          while [ $ATTEMPT -lt 3 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            git fetch origin master
            REMOTE=$(git rev-parse origin/master)
            echo "::group::Land attempt $ATTEMPT (base=$BASE_SHA verified_against=$VERIFIED_AGAINST origin/master=$REMOTE)"

            if [ "$REMOTE" != "$VERIFIED_AGAINST" ]; then
              echo "::warning title=stale base::master moved from ${VERIFIED_AGAINST} to ${REMOTE} while this change was being built. Rebasing and re-running CI before merge."
              git checkout "$WORK_BRANCH"
              if ! git rebase "$REMOTE"; then
                git rebase --abort || true
                echo "conflict=1" >> "$GITHUB_OUTPUT"
                echo "Branch was cut from \`${BASE_SHA}\`, but master is now \`${REMOTE}\`. Rebasing onto it hit a **merge conflict**, so master was left untouched." > /tmp/af/stale-note.md
                echo "::endgroup::"
                exit 0
              fi

              # Re-verify the REBASED tree with the same blocking gate as the heal loop
              # (lint stays advisory; tests are cheap and cover logic the build cannot see).
              echo "--- re-verify after rebase onto $REMOTE ---"
              RECHECK=/tmp/af/rebase-checks.log
              set +e
              ( cd "$GITHUB_WORKSPACE/$APP_DIR" && npx tsc --noEmit ) 2>&1 | tee "$RECHECK"; T=${PIPESTATUS[0]}
              ( cd "$GITHUB_WORKSPACE/$APP_DIR" && npm test ) 2>&1 | tee -a "$RECHECK"; V=${PIPESTATUS[0]}
              ( cd "$GITHUB_WORKSPACE/$APP_DIR" && npm run build ) 2>&1 | tee -a "$RECHECK"; B=${PIPESTATUS[0]}
              set -e
              echo "post-rebase tsc=$T test=$V build=$B"
              # The re-verify build dirties the generated files again — clean up before branching.
              git checkout -- . 2>/dev/null || true
              if [ $T -ne 0 ] || [ $V -ne 0 ] || [ $B -ne 0 ]; then
                echo "::error title=stale base broke the build::This change passed CI against ${BASE_SHA} but FAILS against the current master (${REMOTE}). master was left untouched."
                echo "stale_broken=1" >> "$GITHUB_OUTPUT"
                echo "Branch was cut from \`${BASE_SHA}\`; master is now \`${REMOTE}\`. The rebase applied cleanly but the code **no longer passes CI against current master** (tsc=${T} test=${V} build=${B}) — it was almost certainly written against something master has since changed or deleted. Re-read the current master before fixing; a textual merge here would have shipped a broken build." > /tmp/af/stale-note.md
                echo "::endgroup::"
                exit 0
              fi
              VERIFIED_AGAINST="$REMOTE"
              git push --force-with-lease origin "$WORK_BRANCH"
            fi

            # Local master may carry a merge commit from a previous failed attempt — reset to remote.
            git checkout -B master "$REMOTE"
            git merge --no-ff \
              -m "[auto-feedback attempt:${ATTEMPT_ID}] merge verified change" \
              -m "Branched from master: ${BASE_SHA}
          Verified against master: ${VERIFIED_AGAINST}" \
              "$WORK_BRANCH"

            if git push origin master; then
              MERGED=1
              echo "::endgroup::"
              break
            fi
            echo "::warning title=push rejected::master moved again during the merge window; retrying (attempt ${ATTEMPT}/3)."
            echo "::endgroup::"
          done

          if [ "$MERGED" != "1" ]; then
            echo "::error title=could not land::Lost the race to master 3 times; master was left untouched."
            echo "conflict=1" >> "$GITHUB_OUTPUT"
            echo "Branch was cut from \`${BASE_SHA}\`. master kept moving underneath this change and it lost the push race 3 times." > /tmp/af/stale-note.md
            exit 0
          fi

          echo "merged=1" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild keys + re-audit (CF-2)
        # An answer-key data/builder change is INERT until stem_answer_keys is rebuilt; a
        # validator/generation change should re-flag the corpus. Run the matching script against the
        # live DB (DATABASE_URL is in env; the scripts read it). Non-fatal — never undo a good merge.
        if: steps.merge.outputs.merged == '1'
        working-directory: ${{ env.APP_DIR }}
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE 'stem_proprietary_blends|stem_style_lexicon|variety_lexicon|appellation_varieties|build-stem-answer-keys'; then
            echo "Rebuilding stem_answer_keys…"; node scripts/build-stem-answer-keys.mjs || echo "::warning title=key rebuild failed::stem_answer_keys not rebuilt"
          fi
          if echo "$CHANGED" | grep -qE 'question-rules|question-validator|audit-questions|question-generation-prompt|get-question'; then
            echo "Re-auditing corpus…"; node scripts/audit-questions.mjs --apply || echo "::warning title=re-audit failed::corpus not re-audited"
          fi

      # NOTE: no explicit Vercel deploy step. Once "Merge to master" pushes a study-app/ change,
      # Vercel git auto-deploy builds + ships it automatically (single deploy path; see header).

      - name: Open PR (review required, could not verify, out of scope, or could not land)
        if: >-
          always() &&
          (steps.heal.outputs.success != '1' ||
           steps.merge.outputs.conflict == '1' ||
           steps.merge.outputs.stale_broken == '1' ||
           steps.scope.outputs.out_of_scope == '1' ||
           env.REVIEW_ONLY == 'true') &&
          steps.heal.outputs.no_changes != '1'
        id: pr
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          STALE_BROKEN: ${{ steps.merge.outputs.stale_broken }}
          OUT_OF_SCOPE: ${{ steps.scope.outputs.out_of_scope }}
        run: |
          git push origin "$WORK_BRANCH" || true
          CURRENT_MASTER=$(git rev-parse origin/master 2>/dev/null || echo unknown)
          # The landing step drops a note here when it refused to merge because master had moved.
          # Kept on disk rather than in GITHUB_OUTPUT: this is free prose, and piping it through an
          # env: block would let a stray ": " in the text break this file's YAML parse.
          STALE_NOTE=""
          [ -f /tmp/af/stale-note.md ] && STALE_NOTE=$(cat /tmp/af/stale-note.md)
          {
            if [ -n "$STALE_NOTE" ]; then
              echo "### Why this needs review: **stale base**"
              echo
              echo "$STALE_NOTE"
              if [ "$STALE_BROKEN" = "1" ]; then
                echo
                echo "Do NOT just re-run CI or force the merge — the diff was written against an older master and needs re-reading against the current one."
              fi
            elif [ "$REVIEW_ONLY" = "true" ]; then
              echo "### Why this needs review: **policy (generation/validator)**"
              echo
              echo "High-stakes change (Kind: generation/validator) — PR-gated for human review by policy. The change is verified (CI green) and scoped, but generation/validator edits must be reviewed before merging."
            elif [ "$OUT_OF_SCOPE" = "1" ]; then
              echo "### Why this needs review: **out of scope**"
              echo
              echo "The change touched files OUTSIDE the allowed scope for this feedback (feature isolation). Review the diff — it must stay within the feature's own files."
            else
              echo "### Why this needs review: **CI did not go green**"
              echo
              echo "The self-heal loop could not get \`tsc --noEmit\`, \`npm test\` and \`npm run build\` passing after 3 attempts. Review the run logs and the diff, fix, and merge manually."
            fi
            echo
            echo "| | commit |"
            echo "|---|---|"
            echo "| Branched from master | \`${BASE_SHA}\` |"
            echo "| master now | \`${CURRENT_MASTER}\` |"
            echo
            if [ "$BASE_SHA" != "$CURRENT_MASTER" ]; then
              echo "> ⚠️ master moved while this was building — check the commits in between before trusting this diff."
            fi
            echo
            echo "master and production were **not** touched."
          } > /tmp/af/pr-body.md
          cat /tmp/af/pr-body.md
          if [ -n "${BIN_PROPOSAL_ID:-}" ]; then
            PR_TITLE="[bin-fix] proposal ${BIN_PROPOSAL_ID}: needs review"
          else
            PR_TITLE="[auto-feedback] attempt ${ATTEMPT_ID}: needs review"
          fi
          PR_URL=$(gh pr create --base master --head "$WORK_BRANCH" \
            --title "$PR_TITLE" \
            --body-file /tmp/af/pr-body.md 2>&1) || true
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "$PR_URL"

      - name: Record result in Neon
        if: always()
        working-directory: ${{ env.APP_DIR }}
        env:
          MERGED: ${{ steps.merge.outputs.merged }}
          COMMIT_SHA: ${{ steps.merge.outputs.sha }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          NO_CHANGES: ${{ steps.heal.outputs.no_changes }}
        run: |
          # Deploy is now async via Vercel git auto-deploy, so the workflow only knows it MERGED —
          # the live deploy lands seconds later (watch the Vercel dashboard if it matters).
          if [ "$MERGED" = "1" ]; then
            APPLY_STATUS=merged
          elif printf '%s' "$PR_URL" | grep -q 'http'; then
            APPLY_STATUS=pr_opened
          else
            APPLY_STATUS=failed
          fi
          # Surface a stale-base failure in the admin UI rather than the generic "needs review".
          if [ -f /tmp/af/stale-note.md ]; then
            export APPLY_ERROR="Built against a master that changed mid-run. $(tr -d '`' < /tmp/af/stale-note.md)"
          fi
          if [ "$NO_CHANGES" = "1" ]; then
            APPLY_STATUS=failed
            export APPLY_ERROR="No code changes were produced for this feedback."
          fi
          # Only pass a clean PR URL through (gh prints the URL on success).
          if ! printf '%s' "$PR_URL" | grep -q 'http'; then PR_URL=""; fi
          export APPLY_STATUS COMMIT_SHA PR_URL
          node scripts/record-apply.mjs

      - name: Update empirical knowledge doc (incremental, → master)
        # Zero-latency knowledge capture: this resolved feedback IS evidence the exam model had a
        # gap, so the same event that changed the code also updates mw_exam_empirical_knowledge.md.
        # Runs LAST and for EVERY outcome (merged / PR-gated / failed / no-change) because the
        # learning lives in the finding, not the merge. Claude (Opus) writes cited, live entries and
        # the script commits straight to master (no PR/branch).
        #
        # Loop- & deploy-safe: a root-level .md push triggers NO workflow (auto-feedback fires on
        # repository_dispatch, not push) and NO Vercel build — the commit carries [skip ci] and the
        # vercel.json ignoreCommand skips [skip ci] commits (and any commit not touching study-app/).
        # Fully NON-FATAL: continue-on-error so it can never undo or red-flag the code change above.
        if: always() && env.ANALYSIS_ID != ''
        continue-on-error: true
        run: |
          set +e
          # Land the doc on master regardless of which branch this run ended on.
          git checkout master || { echo "::warning title=empirical sync::could not checkout master; skipped"; exit 0; }
          git pull --ff-only origin master || true
          node "$APP_DIR/scripts/sync-empirical-knowledge.mjs" \
            --mode incremental --analysis-id "$ANALYSIS_ID" --commit \
            || echo "::warning title=empirical sync::knowledge doc not updated for analysis $ANALYSIS_ID"

      - name: Sync empirical_knowledge table (Neon) from the updated doc
        # The feedback-analysis agent reads a Neon MIRROR of the doc at runtime. The standalone
        # ek-table-sync.yml is supposed to rebuild it on every doc push — but the step above pushes
        # with GITHUB_TOKEN, and GitHub SUPPRESSES workflow triggers from GITHUB_TOKEN pushes, so it
        # never fires for bot knowledge commits and the mirror silently lags the doc (this is exactly
        # how EK-0131 went missing). Rebuild the table in-job here instead of relying on that trigger.
        # Non-fatal: the doc stays canonical and the next doc change / manual dispatch reconciles it.
        if: always() && env.ANALYSIS_ID != ''
        continue-on-error: true
        run: |
          set +e
          node "$APP_DIR/scripts/sync-ek-table.mjs" \
            || echo "::warning title=ek-table sync::empirical_knowledge table not rebuilt; mirror may be stale until the next run."
          exit 0
