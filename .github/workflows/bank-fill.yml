name: bank-fill

# Manual Fill-the-Bank run, driven from GitHub Actions rather than a laptop or a serverless route.
#
# WHY HERE: generation is long-running and network-heavy. Run locally it failed on connection
# timeouts alone — 31 in 32 minutes, against 15 budget exhaustions and a handful of genuine validator
# rejections; $31.92 bought about ten questions. The work was fine, the link was not. Runners have a
# stable route to the API and a 6-hour ceiling instead of the 300s a Vercel invocation gets, so a
# whole paper finishes in one job instead of a chain of resume hops behind an hourly cron.
#
# Questions land status='pending' under a per-paper batch — nothing reaches a candidate until it is
# kept in the Fill-the-Bank review pane, which shows the hard-validator verdict for each one.
#
# SETUP: ANTHROPIC_API_KEY and DATABASE_URL must exist in this repository's Actions secrets (both
# already used by auto-feedback.yml).

on:
  workflow_dispatch:
    inputs:
      paper:
        description: "Paper to fill (1, 2, 3, or all)"
        type: choice
        options: ["1", "2", "3", "all"]
        default: "1"
        required: true
      target:
        description: "Questions per on-grid family"
        default: "10"
        required: true
      max:
        description: "Hard ceiling on questions this run (cost control; 0 = no cap)"
        default: "20"
        required: true
      dry_run:
        description: "Report the plan and stop before spending anything"
        type: boolean
        default: false

# Never let two fills generate into the same bank at once: they would compute deficits from the same
# snapshot and both fill them.
concurrency:
  group: bank-fill
  cancel-in-progress: false

permissions: {}

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      APP_DIR: study-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: study-app/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Fill the bank
        working-directory: ${{ env.APP_DIR }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The 95s default is sized for the interactive path, where the browser aborts at 120s.
          # Nothing here is waiting on a browser, and the clean pilot had questions converging on
          # attempt 7 — at 95s the loop gets three or four and falls back to a banked question,
          # which the batch counts as a failure.
          GENERATION_BUDGET_MS: "180000"
        run: |
          set -euo pipefail
          node --import ./scripts/ts-loader.mjs scripts/fill-bank.mjs \
            --paper='${{ inputs.paper }}' \
            --target='${{ inputs.target }}' \
            --max='${{ inputs.max }}' \
            ${{ inputs.dry_run && '--dry-run' || '' }}
